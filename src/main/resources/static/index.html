<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Transcription</title>
	<style>
	* {
		box-sizing: border-box;
	}	
	
	.status-box {
	    text-align: left;
		padding: 30px 24px;
	}
	
	.status-heading {
		color: black;
		font-family: sans-serif;
		font-size: 20px;
	}
	
	body {
		margin:0;
		min-height: 100vh;
		padding: 50px 20px;
		font-family: sans-serif;
	}
	
	.page-container {
	    width: min(100%, 660px);
	    margin: 0 auto;
	}
	
	.box {
		width: 100%;
		min-height: 120px;
		background-color: floralwhite;
		border: 3px solid darkslategrey;
		border-radius: 8px;
		padding: 30px;
		margin: 0 0 15px;
		text-align: center;
	}
	
	h1 {
		margin: 0 0 14px;
	    color: black;
		font-family: sans-serif;
		text-align: center;
	}
	
	.status,
	.recording-result {
	    margin: 0;
	    color: grey;
	    font-family: sans-serif;
	    line-height: 1.5;
	}
	
	.recording-result {
	    margin-top: 14px;
	}
	
	.intro-text {
	    margin: 0;
	    color: grey;
	    font-family: sans-serif;
	    text-align: center;
	}
	
	.button-box {
	    display: flex;
	    justify-content: center;
	    gap: 40px;
		align-items: center;
		width: 100%;
	}

	.startButton {
		flex: 1;
		min-width: 0;
		background-color: green;
		color: white;
		font-size: 20px;
		font-family: sans-serif;
		padding: 30px 50px;
		cursor: pointer;
		transition: background 0.3s ease;
	}
	
	.startButton:hover:not(:disabled) {
	  	background-color: darkgreen;
	}
	
	.stopButton {
		flex: 1;
		min-width: 0;
		background-color: red;
		color: white;
		font-size: 20px;
		font-family: sans-serif;
		padding: 30px 50px;
		cursor: pointer;
		transition: background 0.3s ease;
	}

	.stopButton:hover:not(:disabled) {
	  background-color: darkred;
	}

	.startButton:disabled,
	.stopButton:disabled {
	    cursor: not-allowed;
	    opacity: 0.5;
	}
	
	@media (max-width: 520px) {
	    .button-box {
	        flex-direction: column;
	        align-items: stretch;
	    }

	    .startButton,
	    .stopButton {
	        width: 100%;
	    }

	    .box {
	        padding: 30px 18px;
	    }

	    h1 {
	        font-size: 1.8rem;
	    }
	}
</style>
</head>
<body>
	<main class="page-container">
		
	<section class="box">
    <h1>Speech to Text Transcription</h1>
	<p class="intro-text">Begin recording audio for transcription...</p>
	
	</section>
	
	<section class="box">
		<div class="button-box">
			<!--Starts a new recording-->
			<button class="startButton" id = "startButton" type="button">Start Recording</button>

			<!--Stops the current recording, disabled until recording begins-->
			<button class="stopButton" id = "stopButton" type="button" disabled>Stop Recording</button>
		</div>
	</section>

	<section class="box status-box">
	
	<p class="status-heading"><b><u>STATUS</u></b></p>
	
	<!--Displays the current status of the recording-->
	<p id="status" class="status">Ready to record.</p>
	
	<!--When recording is finished, the message begins recording-->
	<p id="recordingResult" class="recording-result"></p>
	
	</section>
		
	<script>
		let mediaRecorder;
		let audioChunks = []; 
		
		const startButton = document.getElementById("startButton");
		const stopButton = document.getElementById("stopButton");
		const status = document.getElementById("status");
		const recordingResult = document.getElementById("recordingResult");
		
		startButton.addEventListener("click", async () => {
			try {
				// Asks the browser for microphone peromission
				const stream = await navigator.mediaDevices.getUserMedia({
					audio: true
				});
				
				// Clears audio from previous recordings 
				audioChunks = [];
				
				// Creates object that records audio from microphone
				mediaRecorder = new MediaRecorder(stream);
				
				// Stores each audio recording 
				mediaRecorder.addEventListener("dataavailable", (event) => {
					audioChunks.push(event.data);
				});
				
				// Combines each part of recording into one, once recording is finished
				mediaRecorder.addEventListener("stop", () => {
					const audioBlob = new Blob(audioChunks, {
						type: "audio/webm"
					});
					
					// Displays message for user, showing the recording is being sent to the server
					recordingResult.textContent = "Upload of recording is currently in progress.."
					
					// Creates a form for the server to receive the audio file
					const formData = new FormData();
					
					// Adds the audio file to the form
					formData.append("audio", audioBlob, "receiving.webm");
					
					// Send the audio file to the end-point
					fetch("/api/audio", {
						method: "POST",
						body: formData
					})
					
						// If an error occurs, the code is stopped and user is notified
						.then(async (response) => {
							
							// The response is read as text, even if it fails
							const responseText = await response.text();
							
							// Errors can then be treated 
							if (!response.ok) {
								throw new Error("Upload failed (" + response.status + "): " + responseText);
							}
							return responseText;
						})
					
						// The transcription text returned by OpenAI is displayed
						.then((transcription) => {
							recordingResult.textContent = "Transcription: " + transcription;
							status.textContent = "Recording is available.";
						})
					
						// Displays the reason for error returned by the Java controller
						.catch((error) => {
							console.error(error);
							recordingResult.textContent = error.message;
							status.textContent = "Recording is available.";
						});
					
						
					// Releases the micrphone after recording
					stream.getTracks().forEach((track) => track.stop());
					
					startButton.disabled = false;
					stopButton.disabled = true;
					status.textContent = "Transcribing the recording...";
				});
				
				// Audio recording begins
				mediaRecorder.start();
				
				// Enable stop button, disable start button to prevent multiple recordings at the same time
				startButton.disabled = true;
				stopButton.disabled = false;
				status.textContent = "Recording in Progress...";
				
			// Catch error and display message
			} catch (error) {
				console.error(error);
				status.textContent = "Unable to access the microphone. Turn Microphone permission on.";	
			}
		});
		
		// Stop recording if a recorder exists and is currently recording
		stopButton.addEventListener("click", () => {
			if (mediaRecorder && mediaRecorder.state === "recording") {
				mediaRecorder.stop();
				status.textContent = "Processing Recording...";
			}
		});
	</script>
</body>
</html>
