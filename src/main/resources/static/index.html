<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Transcription</title>
	<link rel="stylesheet" href="style.css">
</head>
<!--In parts of the html below, generative AI was used to give inspiration on design choices, understanding parts of code, and helping to design the web page-->
<!--As the file is reasonably large, it was also used to clean up the code and reduce time spent on de-bugging-->

<!--All local testing was done using a personal OpenAI Platofrm API key, where credits were added to my personal account so the speech to text endpoint could be called-->
<!--The key was not hard coded into the java, rather it was supplied as a variable in terminal-->
<!--The project was then run through that same terminal, and tested using my voice and videos with sound-->
<body>
	<main class="page-container">
		
	<section class="box">
    <h1>Speech to Text Transcription</h1>
	<p class="intro-text">Assignment 1: Java Web Project</p>
	</section>
	
	<section class="box">
		<div class="button-box">
			<!--Starts a new recording-->
			<button class="startButton" id = "startButton" type="button">Start Recording</button>

			<!--Stops the current recording, disabled until recording begins-->
			<button class="stopButton" id = "stopButton" type="button" disabled>Stop Recording</button>
		</div>
	</section>

	<section class="box status-box">
	<!--Displays the current status of the recording-->
	<p id="status" class="status">Ready to record.</p>
	
	<!--When recording is finished, the message begins recording-->
	<p id="recordingResult" class="recording-result"></p>
	
	<!--Displays the elapsed time since the beginning of the recording-->
	<div class="timer-container">
		<span id="recordingIndicator" class="recording-indicator"></span>
		<p id="recordingTimer" class="recording-timer">0 seconds</p>
	</div>
	</section>
		
	<script>
		let mediaRecorder;
		let audioChunks = []; 
		let seconds = 0;
		let timer;
		
		const startButton = document.getElementById("startButton");
		const stopButton = document.getElementById("stopButton");
		const status = document.getElementById("status");
		const recordingResult = document.getElementById("recordingResult");
		const recordingTimer = document.getElementById("recordingTimer");
		const recordingIndicator = document.getElementById("recordingIndicator");
		
		startButton.addEventListener("click", async () => {
			try {
				// Asks the browser for microphone peromission
				const stream = await navigator.mediaDevices.getUserMedia({
					audio: true
				});
				
				// Clears audio from previous recordings 
				audioChunks = [];
				
				// Creates object that records audio from microphone
				mediaRecorder = new MediaRecorder(stream);
				
				// Stores each audio recording 
				mediaRecorder.addEventListener("dataavailable", (event) => {
					audioChunks.push(event.data);
				});
				
				// Combines each part of recording into one, once recording is finished
				mediaRecorder.addEventListener("stop", () => {
					const audioBlob = new Blob(audioChunks, {
						type: "audio/webm"
					});
					
					// Displays message for user, showing the recording is being sent to the server
					recordingResult.textContent = "Upload of recording is currently in progress.."
					
					// Creates a form for the server to receive the audio file
					const formData = new FormData();
					
					// Adds the audio file to the form
					formData.append("audio", audioBlob, "receiving.webm");
					
					// Send the audio file to the end-point
					fetch("/api/audio", {
						method: "POST",
						body: formData
					})
					
						// If an error occurs, the code is stopped and user is notified
						.then(async (response) => {
							
							// The response is read as text, even if it fails
							const responseText = await response.text();
							
							// Errors can then be treated 
							if (!response.ok) {
								throw new Error("Upload failed (" + response.status + "): " + responseText);
							}
							return responseText;
						})
					
						// The transcription text returned by OpenAI is displayed
						.then((transcription) => {
							recordingResult.textContent = "Transcription: "+ transcription;
							status.textContent = "Recording is available.";
						})
					
						// Displays the reason for error returned by the Java controller
						.catch((error) => {
							console.error(error);
							recordingResult.textContent = error.message;
							status.textContent = "Recording is available.";
							status.style.color = "forestgreen";
						});
					
						
					// Releases the micrphone after recording
					stream.getTracks().forEach((track) => track.stop());
					
					startButton.disabled = false;
					stopButton.disabled = true;
					status.textContent = "Transcribing the recording...";
				});
				
				// Audio recording begins
				mediaRecorder.start();
				
				// Create a timer to track how long the recording has been going
				seconds = 0;
				recordingTimer.textContent = "0 seconds";
				recordingIndicator.classList.add("recording");

				timer = setInterval(() => {
				    seconds++;
				    recordingTimer.textContent = seconds + " seconds";
				}, 1000);
				
				// Enable stop button, disable start button to prevent multiple recordings at the same time
				startButton.disabled = true;
				stopButton.disabled = false;
				status.textContent = "Recording in Progress...";
				status.style.color = "red";
				
			// Catch error and display message
			} catch (error) {
				console.error(error);
				status.textContent = "Unable to access the microphone. Turn Microphone permission on.";	
			}
		});
		
		// Stop recording if a recorder exists and is currently recording
		stopButton.addEventListener("click", () => {
			if (mediaRecorder && mediaRecorder.state === "recording") {
				mediaRecorder.stop();
				recordingIndicator.classList.remove("recording");
				clearInterval(timer);
				status.textContent = "Processing Recording...";
			}
		});
	</script>
</body>
</html>
